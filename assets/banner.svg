<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyanGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1f2937" stroke-opacity=".6" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseGlow{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(-15px,10px);opacity:.6}}@keyframes pulsePurple{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.22) translate(15px,-10px);opacity:.55}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.bg-grid{fill:url(#grid)}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8;letter-spacing:.8px}.orb-cyan{transform-origin:200px 180px;animation:pulseGlow 8s ease-in-out infinite}.orb-purple{transform-origin:1000px 180px;animation:pulsePurple 9s ease-in-out infinite}.radar-beam{transform-origin:1050px 180px;animation:radarSweep 10s linear infinite}.flowing-path{stroke-dasharray:8,8;animation:dashTravel 4s linear infinite}.pill-float{animation:floatPill 5s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" class="bg-grid" rx="16"/><g><circle cx="180" cy="180" r="160" fill="#0284c7" class="orb-cyan" filter="url(#glow)" opacity=".35"/><circle cx="1020" cy="180" r="170" fill="#7c3aed" class="orb-purple" filter="url(#glow)" opacity=".3"/></g><g opacity=".5"><circle cx="1050" cy="180" r="120" fill="none" stroke="#334155" stroke-width="1.5"/><circle cx="1050" cy="180" r="80" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/><circle cx="1050" cy="180" r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity=".6"/><line x1="910" x2="1190" y1="180" y2="180" stroke="#1e293b" stroke-width="1.5"/><line x1="1050" x2="1050" y1="40" y2="320" stroke="#1e293b" stroke-width="1.5"/><g class="radar-beam"><line x1="1050" x2="1170" y1="180" y2="180" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/></g></g><g opacity=".4"><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 80 80 Q 250 140 450 90 T 800 110" class="flowing-path"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M 120 300 Q 350 240 600 280 T 1100 290" class="flowing-path"/></g><g class="pill-float" transform="translate(70, 110)"><rect width="64" height="64" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" rx="16"/><path fill="none" stroke="url(#accentGrad)" stroke-linejoin="round" stroke-width="2.5" d="M 32 16 L 48 22 V 34 C 48 44 41 51 32 54 C 23 51 16 44 16 34 V 22 Z"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M 26 35 L 30 39 L 38 29"/></g><g><g transform="translate(160, 115) translate(0, 0)"><rect width="365" height="28" fill="#0c4a6e" fill-opacity=".6" stroke="#0284c7" stroke-width="1" rx="14"/><circle cx="14" cy="14" r="4" fill="#38bdf8"/><text x="28" y="19" class="badge-text">CENTRALIZED SECURITY ECOSYSTEM</text></g><text x="0" y="70" class="title-text" transform="translate(160, 115)">Awesome Centralized Security Management</text><text x="0" y="105" class="subtitle-text" transform="translate(160, 115)">Curated SIEM • XDR • SOAR • CSPM • SOC Automation &amp; Intelligence</text><g transform="translate(160, 115) translate(0, 130)"><rect width="110" height="26" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="14" y="17" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🛡️ SIEM &amp; XDR</text><rect width="125" height="26" x="122" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="136" y="17" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">⚡ SOAR &amp; SOC</text><rect width="135" height="26" x="259" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="273" y="17" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">☁️ Cloud CSPM</text><rect width="160" height="26" x="406" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="420" y="17" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🔍 Threat Intelligence</text></g></g></svg>