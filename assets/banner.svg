<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-grid { fill: url(#grid); }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 0.8px;
    }

    /* Ambient Pulsing Background Orbs */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(-15px, 10px); opacity: 0.6; }
    }
    @keyframes pulsePurple {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.22) translate(15px, -10px); opacity: 0.55; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -100; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .orb-cyan {
      transform-origin: 200px 180px;
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .orb-purple {
      transform-origin: 1000px 180px;
      animation: pulsePurple 9s ease-in-out infinite;
    }
    .radar-beam {
      transform-origin: 1050px 180px;
      animation: radarSweep 10s linear infinite;
    }
    .flowing-path {
      stroke-dasharray: 8, 8;
      animation: dashTravel 4s linear infinite;
    }
    .pill-float {
      animation: floatPill 5s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" class="bg-grid" rx="16" />

  <!-- Dynamic Ambient Orbs (Background layer) -->
  <g>
    <circle cx="180" cy="180" r="160" fill="#0284c7" filter="url(#glow)" class="orb-cyan" opacity="0.35" />
    <circle cx="1020" cy="180" r="170" fill="#7c3aed" filter="url(#glow)" class="orb-purple" opacity="0.3" />
  </g>

  <!-- Futuristic Radar/SOC Telemetry Geometry (Right Background) -->
  <g opacity="0.5">
    <circle cx="1050" cy="180" r="120" fill="none" stroke="#334155" stroke-width="1.5" />
    <circle cx="1050" cy="180" r="80" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4, 4" />
    <circle cx="1050" cy="180" r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <line x1="910" y1="180" x2="1190" y2="180" stroke="#1e293b" stroke-width="1.5" />
    <line x1="1050" y1="40" x2="1050" y2="320" stroke="#1e293b" stroke-width="1.5" />
    <!-- Dynamic Radar Sweep Line -->
    <g class="radar-beam">
      <line x1="1050" y1="180" x2="1170" y2="180" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)" />
    </g>
  </g>

  <!-- Flowing Network Connection Lines (Background) -->
  <g opacity="0.4">
    <path d="M 80 80 Q 250 140 450 90 T 800 110" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flowing-path" />
    <path d="M 120 300 Q 350 240 600 280 T 1100 290" fill="none" stroke="#818cf8" stroke-width="1.5" class="flowing-path" />
  </g>

  <!-- Left Shield Icon Container (Graphic Accent) -->
  <g transform="translate(70, 110)" class="pill-float">
    <rect width="64" height="64" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
    <!-- Shield Outline -->
    <path d="M 32 16 L 48 22 V 34 C 48 44 41 51 32 54 C 23 51 16 44 16 34 V 22 Z" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Checkmark inside Shield -->
    <path d="M 26 35 L 30 39 L 38 29" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Main Title and Typography (Always crystal clear on top) -->
  <g transform="translate(160, 115)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="365" height="28" rx="14" fill="#0c4a6e" fill-opacity="0.6" stroke="#0284c7" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8" />
      <text x="28" y="19" class="badge-text">CENTRALIZED SECURITY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" class="title-text">Awesome Centralized Security Management</text>

    <!-- Subtitle -->
    <text x="0" y="105" class="subtitle-text">Curated SIEM • XDR • SOAR • CSPM • SOC Automation &amp; Intelligence</text>

    <!-- Feature Tag Pills -->
    <g transform="translate(0, 130)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🛡️ SIEM &amp; XDR</text>

      <!-- Pill 2 -->
      <rect x="122" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="136" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ SOAR &amp; SOC</text>

      <!-- Pill 3 -->
      <rect x="259" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="273" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">☁️ Cloud CSPM</text>

      <!-- Pill 4 -->
      <rect x="406" y="0" width="160" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="420" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🔍 Threat Intelligence</text>
    </g>
  </g>
</svg>
